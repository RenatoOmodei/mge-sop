name: S&OP CI

on:
  pull_request:
  push:
    branches:
      - main
      - homolog

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build Netlify artifact
        run: npm run build:netlify
        env:
          SOP_BACKEND_URL: ${{ secrets.SOP_HOMOLOG_BACKEND_URL }}
          SOP_ENV: homolog
