services:
  - type: web
    name: mge-sop-api-homolog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/render-health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: staging
      - key: APP_ENV
        value: homolog
      - key: DB_PROVIDER
        value: postgres
      - key: POSTGRES_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: mge-sop-db-homolog
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: mge-sop-db-homolog
    plan: free
    databaseName: mge_sop_homolog
    user: mge_sop_homolog_user
